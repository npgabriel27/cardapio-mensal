<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cardápio Mensal</title>
<meta name="description" content="Organize e distribua os pratos do cardápio mensal em almoços e jantas.">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181714" media="(prefers-color-scheme: dark)">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cardápio">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-alt: #f0ede8;
    --border: #e0ddd7;
    --border-strong: #c8c4bc;
    --text: #1c1b18;
    --text-2: #5c5a55;
    --text-3: #9c9a94;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --danger: #dc2626;
    --warn-bg: #fef9c3;
    --warn-text: #854d0e;
    --radius: 8px;
    --radius-sm: 5px;
    --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181714;
      --surface: #22211e;
      --surface-alt: #2a2925;
      --border: #38362f;
      --border-strong: #4e4b42;
      --text: #f0ede8;
      --text-2: #a8a49c;
      --text-3: #6a6760;
      --accent: #60a5fa;
      --accent-bg: #1e3a5f;
      --warn-bg: #3a2e00;
      --warn-text: #fbbf24;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── Layout ── */
  .shell {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
    padding-top: calc(2rem + env(safe-area-inset-top));
    padding-bottom: calc(4rem + env(safe-area-inset-bottom));
  }

  /* ── Header ── */
  .site-header {
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .site-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .site-sub {
    font-size: 13px;
    color: var(--text-2);
    margin-top: 2px;
  }

  /* ── Tabs ── */
  .tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .tab-btn {
    padding: 9px 18px;
    font-size: 14px;
    font-family: var(--font);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-2);
    cursor: pointer;
    font-weight: 400;
    transition: color 0.12s, border-color 0.12s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }

  /* ── Panels ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.75rem;
  }

  /* ── Dish list ── */
  .dish-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 0.12s;
  }
  .dish-item:hover { border-color: var(--border-strong); }

  .dish-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .dish-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .dish-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
    font-family: var(--font);
    transition: color 0.12s;
  }
  .icon-btn:hover { color: var(--danger); }

  .dish-row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: center;
  }

  .ctrl-label {
    font-size: 11px;
    color: var(--text-3);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .toggle-group { display: flex; gap: 6px; }
  .tog {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border-strong);
    font-size: 12px;
    cursor: pointer;
    background: transparent;
    color: var(--text-2);
    font-family: var(--font);
    transition: all 0.12s;
    line-height: 1;
  }
  .tog.on {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }

  .qty-row { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: transparent;
    font-size: 16px;
    cursor: pointer;
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }
  .qty-btn:hover { background: var(--surface-alt); }
  .qty-val {
    font-size: 16px;
    font-weight: 500;
    min-width: 28px;
    text-align: center;
    color: var(--text);
  }

  /* ── Add form ── */
  .add-form {
    background: var(--surface-alt);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 4px;
  }
  .add-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; color: var(--text-2); }

  .form-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .text-input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color 0.12s;
  }
  .text-input:focus { border-color: var(--accent); }

  .color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cpick {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .cpick:hover { transform: scale(1.15); }
  .cpick.sel { border-color: var(--text) !important; }

  .primary-btn {
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--text);
    color: var(--surface);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: opacity 0.12s;
  }
  .primary-btn:hover { opacity: 0.82; }
  .primary-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .ghost-btn {
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: transparent;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-2);
    font-family: var(--font);
    transition: background 0.12s, color 0.12s;
  }
  .ghost-btn:hover { background: var(--surface-alt); color: var(--text); }

  .err-msg {
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
    min-height: 16px;
  }

  /* ── Summary bar ── */
  .summary-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    margin-bottom: 1rem;
    font-size: 13px;
    color: var(--text-2);
  }
  .summary-bar strong { color: var(--text); font-weight: 500; }
  .warn-tag {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 500;
  }

  /* ── Cal controls ── */
  .cal-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 1rem;
  }
  .date-label { font-size: 13px; color: var(--text-2); white-space: nowrap; }
  .date-input {
    padding: 7px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    outline: none;
    cursor: pointer;
  }
  .date-input:focus { border-color: var(--accent); }
  .date-err { font-size: 12px; color: var(--danger); }

  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  /* ── Calendar ── */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 2rem;
  }
  .cal-dh {
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 3px 0 6px;
  }
  .cal-day {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 4px;
    min-height: 82px;
    transition: border-color 0.12s, outline-color 0.12s;
  }
  .cal-day:hover { border-color: var(--border-strong); }
  .cal-day.empty { background: transparent; border-color: transparent; }
  .cal-day.today { border-color: var(--accent); }
  .day-num { font-size: 10px; color: var(--text-3); margin-bottom: 3px; font-weight: 500; }
  .cal-day.today .day-num { color: var(--accent); font-weight: 600; }
  .dow-mobile { display: none; }

  /* Subtle inline month marker — no grid break, just a label + hairline.
     Positioned absolutely so it never shifts grid/flow placement of the
     day number or meal slots (incl. the mobile nth-child-free layout). */
  .cal-day.month-start { border-top: 2px solid var(--accent); padding-top: 13px; }
  .month-tag {
    position: absolute;
    top: 3px; left: 5px; right: 5px;
    font-size: 7px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meal-slot { margin-bottom: 2px; border-radius: 3px; }
  .meal-lbl { font-size: 7px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 1px; }
  .meal-pill {
    font-size: 7.5px;
    font-weight: 600;
    border-radius: 3px;
    padding: 2px 4px;
    line-height: 1.35;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meal-pill[draggable-slot] { cursor: grab; touch-action: none; user-select: none; }
  .meal-pill.dragging { opacity: 0.35; }
  .meal-pill.delivery { border: 1px dashed currentColor; }
  .delivery-badge { margin-right: 2px; }
  .meal-none { font-size: 7.5px; color: var(--text-3); font-style: italic; }
  .meal-empty { font-size: 7.5px; color: var(--border-strong); font-style: italic; }
  .meal-noopt { font-size: 7.5px; color: var(--text-3); font-style: italic; }

  /* Drag-and-drop */
  .drag-ghost {
    opacity: 0.9;
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    transform: scale(1.06);
  }
  .meal-slot.drop-target {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-bottom: 1rem;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* ── Print ──
     Only the calendar grid itself should print — everything above it
     (header, tabs, date field, summary bar, action buttons, legend) is
     hidden so the page starts at the calendar. */
  @media print {
    body { background: white; color: black; font-size: 10px; }
    .site-header, .tab-bar, .cal-controls, .summary-bar, .action-row, .legend {
      display: none !important;
    }
    .panel { display: none !important; }
    #panel-cal { display: block !important; }
    #panel-config { display: none !important; }
    .cal-day { min-height: 70px; border: 1px solid #ccc; }
    .meal-slot.drop-target { outline: none; }
    .shell { padding: 0.5rem; max-width: 100%; }
    @page { size: A4 landscape; margin: 10mm; }
  }

  /* ── Responsive (tablet & phone) ── */
  @media (max-width: 680px) {
    .shell { padding: 1rem 0.75rem 3rem; }

    .site-header { margin-bottom: 1.25rem; padding-bottom: 1rem; }
    .site-title { font-size: 18px; }

    .tab-bar { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
    .tab-btn { flex: 1; padding: 10px 8px; font-size: 14px; text-align: center; }

    .dish-row2 { grid-template-columns: 1fr; gap: 14px; }
    .qty-btn { width: 32px; height: 32px; font-size: 18px; }
    .icon-btn { font-size: 22px; padding: 4px 6px; }
    .tog { padding: 7px 14px; font-size: 13px; }

    .form-row { flex-wrap: wrap; }
    .text-input { min-width: 0; flex-basis: 100%; }
    .form-row .primary-btn { flex: 1; }

    .cal-controls { flex-direction: column; align-items: stretch; }
    .date-label { white-space: normal; }
    .date-input { width: 100%; padding: 10px; font-size: 15px; }

    .action-row { flex-direction: column; }
    .action-row button { width: 100%; padding: 10px; font-size: 14px; }

    .summary-bar { font-size: 12.5px; }
    .legend { gap: 8px 12px; }

    /* Calendar becomes a readable single-column agenda instead of a 7-col grid */
    .cal-grid { grid-template-columns: 1fr; gap: 8px; }
    .cal-dh { display: none; }
    .cal-day.empty { display: none; }
    .cal-day {
      display: grid;
      grid-template-columns: 52px 1fr;
      column-gap: 10px;
      row-gap: 6px;
      align-items: start;
      min-height: 0;
      padding: 10px 12px;
    }
    .cal-day.today { border-width: 2px; }
    .cal-day.month-start { padding-top: 18px; }
    .month-tag { left: 12px; right: 12px; }
    .day-num {
      grid-column: 1;
      grid-row: 1 / -1;
      font-size: 13px;
      line-height: 1.3;
      padding-top: 2px;
    }
    .dow-mobile {
      display: block;
      font-size: 10px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-weight: 600;
    }
    .cal-day.today .dow-mobile { color: var(--accent); }
    .cal-day > .meal-slot[data-meal="al"] { grid-column: 2; grid-row: 1; }
    .cal-day > .meal-slot[data-meal="jan"] { grid-column: 2; grid-row: 2; }
    .meal-slot { margin-bottom: 0; }
    .meal-lbl { font-size: 10.5px; margin-bottom: 3px; }
    .meal-pill { font-size: 13px; padding: 5px 9px; white-space: normal; }
    .meal-none, .meal-empty, .meal-noopt { font-size: 12.5px; }
  }

  @media (max-width: 380px) {
    .tab-btn { font-size: 13px; padding: 9px 6px; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="site-header">
    <div>
      <div class="site-title">Cardápio Mensal</div>
      <div class="site-sub">Leticia &amp; Gabriel · Plano Renata Sales</div>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('config')">Configurar pratos</button>
    <button class="tab-btn" onclick="showTab('cal')">Calendário</button>
  </div>

  <!-- ── CONFIG PANEL ── -->
  <div class="panel active" id="panel-config">
    <p style="font-size:13px;color:var(--text-2);margin-bottom:1rem;">
      Defina os pratos, se aparecem no almoço, jantar ou ambos, e quantas vezes no mês.
      Depois vá para a aba <strong>Calendário</strong> para distribuir.
    </p>

    <div id="dishList"></div>

    <div class="add-form" style="margin-top:12px">
      <p class="add-title">Novo prato</p>
      <div class="form-row">
        <input class="text-input" id="newName" placeholder="Nome do prato" maxlength="40">
        <button class="primary-btn" onclick="addDish()">Adicionar</button>
      </div>
      <div class="color-row" id="colorPick"></div>
      <div class="err-msg" id="addErr"></div>
    </div>
  </div>

  <!-- ── CALENDAR PANEL ── -->
  <div class="panel" id="panel-cal">
    <div class="cal-controls">
      <span class="date-label">Início (segunda-feira):</span>
      <input type="date" class="date-input" id="startDate">
      <span class="date-err" id="dateErr"></span>
    </div>

    <div class="summary-bar" id="summaryBar">
      Escolha uma data de início para ver o resumo.
    </div>

    <div class="action-row">
      <button class="primary-btn" id="spreadBtn" onclick="spread(false)">Distribuir pratos</button>
      <button class="ghost-btn" id="reshuffleBtn" onclick="spread(true)">↺ Redistribuir</button>
      <button class="ghost-btn" onclick="window.print()">Imprimir / PDF</button>
    </div>

    <div class="legend" id="legend"></div>
    <div id="calContainer"></div>
  </div>

</div>

<script>
'use strict';

// ── Color palette ──────────────────────────────────────────────
const PALETTE = [
  { bg:'#E6F1FB', text:'#0C447C', border:'#85B7EB' },
  { bg:'#EAF3DE', text:'#27500A', border:'#97C459' },
  { bg:'#FAECE7', text:'#712B13', border:'#F0997B' },
  { bg:'#FAEEDA', text:'#633806', border:'#FAC775' },
  { bg:'#FBEAF0', text:'#72243E', border:'#ED93B1' },
  { bg:'#EEEDFE', text:'#3C3489', border:'#AFA9EC' },
  { bg:'#E1F5EE', text:'#085041', border:'#5DCAA5' },
  { bg:'#FCEBEB', text:'#791F1F', border:'#F09595' },
  { bg:'#FFF7ED', text:'#7C3D12', border:'#FDBA74' },
  { bg:'#F0FDF4', text:'#14532D', border:'#86EFAC' },
];

// ── State ──────────────────────────────────────────────────────
let dishes = [
  { id:1, name:'Frango grelhado',      color:0, al:true,  jan:true,  qty:8 },
  { id:2, name:'Filé de peixe',        color:1, al:true,  jan:false, qty:4 },
  { id:3, name:'Alcatra / Contrafilé', color:2, al:true,  jan:false, qty:6 },
  { id:4, name:'Mac. c/ carne moída',  color:3, al:true,  jan:true,  qty:4 },
  { id:5, name:'Hambúrguer patinho',   color:4, al:false, jan:true,  qty:4 },
  { id:6, name:'Pastelzinho',          color:5, al:false, jan:true,  qty:4 },
  { id:7, name:'Pizza frigideira',     color:6, al:false, jan:true,  qty:4 },
  { id:8, name:'Carne em tiras',       color:2, al:true,  jan:true,  qty:3 },
];
let nextId = 9;
let selColor = 0;
let calPlan = null; // array of {date, al: id|null, jan: id|null}

// ── Helpers ────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dayOfWeekMon(jsDay) { // Monday=0 … Sunday=6
  return jsDay === 0 ? 6 : jsDay - 1;
}

function getStartDate() {
  const v = document.getElementById('startDate').value;
  if (!v) return null;
  const d = new Date(v + 'T12:00:00');
  return d.getDay() === 1 ? d : null;
}

function getDays(start, count = 30) {
  const days = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }
  return days;
}

// Count available al/jan slots across 30 days (slots eligible for the
// automatic pool distribution — "Sem opção" defaults are excluded).
function countSlots(days) {
  let al = 0, jan = 0;
  days.forEach(d => {
    const dow = d.getDay();
    if (dow === 6)      { al++; }          // Sáb: almoço no pool, janta = Sem opção
    else if (dow === 0) { /* Dom: al e jan = Sem opção */ }
    else                { al++; jan++; }   // Seg-Sex (Sex janta = delivery, mas ainda no pool)
  });
  return { al, jan, total: al + jan };
}

// ── Tab switching ──────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) =>
    b.classList.toggle('active', (i === 0 && name === 'config') || (i === 1 && name === 'cal'))
  );
  document.getElementById('panel-config').classList.toggle('active', name === 'config');
  document.getElementById('panel-cal').classList.toggle('active', name === 'cal');
  if (name === 'cal') { updateSummary(); renderLegend(); renderCal(); }
}

// ── Color picker ───────────────────────────────────────────────
function renderColorPick() {
  const el = document.getElementById('colorPick');
  el.innerHTML = PALETTE.map((c, i) =>
    `<div class="cpick${i === selColor ? ' sel' : ''}"
       style="background:${c.bg};border-color:${i === selColor ? c.text : 'transparent'}"
       onclick="pickColor(${i})" title="Cor ${i+1}"></div>`
  ).join('');
}

function pickColor(i) { selColor = i; renderColorPick(); }

// ── Dish CRUD ──────────────────────────────────────────────────
function addDish() {
  const nm = document.getElementById('newName').value.trim();
  const err = document.getElementById('addErr');
  if (!nm) { err.textContent = 'Digite o nome do prato.'; return; }
  if (dishes.find(d => d.name.toLowerCase() === nm.toLowerCase())) {
    err.textContent = 'Já existe um prato com esse nome.'; return;
  }
  err.textContent = '';
  dishes.push({ id: nextId++, name: nm, color: selColor, al: true, jan: true, qty: 4 });
  document.getElementById('newName').value = '';
  calPlan = null;
  renderDishes();
}

function delDish(id) {
  dishes = dishes.filter(d => d.id !== id);
  calPlan = null;
  renderDishes();
}

function toggleMeal(id, which) {
  const d = dishes.find(x => x.id === id);
  if (!d) return;
  const other = which === 'al' ? 'jan' : 'al';
  if (d[which] && !d[other]) return; // must keep at least one
  d[which] = !d[which];
  calPlan = null;
  renderDishes();
}

function changeQty(id, delta) {
  const d = dishes.find(x => x.id === id);
  if (!d) return;
  d.qty = Math.max(0, Math.min(60, d.qty + delta));
  calPlan = null;
  renderDishes();
  updateSummary();
}

function renderDishes() {
  const el = document.getElementById('dishList');
  el.innerHTML = dishes.map(d => {
    const c = PALETTE[d.color];
    return `<div class="dish-item">
      <div class="dish-top">
        <div class="dish-swatch" style="background:${c.bg};border:1.5px solid ${c.text}"></div>
        <span class="dish-name">${escHtml(d.name)}</span>
        <button class="icon-btn" onclick="delDish(${d.id})" aria-label="Remover ${escHtml(d.name)}">×</button>
      </div>
      <div class="dish-row2">
        <div>
          <div class="ctrl-label">Refeição</div>
          <div class="toggle-group">
            <button class="tog${d.al ? ' on' : ''}" onclick="toggleMeal(${d.id},'al')">Almoço</button>
            <button class="tog${d.jan ? ' on' : ''}" onclick="toggleMeal(${d.id},'jan')">Janta</button>
          </div>
        </div>
        <div>
          <div class="ctrl-label">Qtd. no mês</div>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty(${d.id},-1)" aria-label="Diminuir">−</button>
            <span class="qty-val">${d.qty}</span>
            <button class="qty-btn" onclick="changeQty(${d.id},+1)" aria-label="Aumentar">+</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  renderColorPick();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Summary bar ────────────────────────────────────────────────
function updateSummary() {
  const bar = document.getElementById('summaryBar');
  const start = getStartDate();
  if (!start) {
    bar.innerHTML = 'Escolha uma data de início (segunda-feira) para ver o resumo.';
    return;
  }
  const days = getDays(start);
  const { al, jan, total } = countSlots(days);

  const alDishes = dishes.filter(d => d.al);
  const janDishes = dishes.filter(d => d.jan);
  const totalAlQty = alDishes.reduce((s, d) => s + d.qty, 0);
  const totalJanQty = janDishes.filter(d => !d.al).reduce((s, d) => s + d.qty, 0)
    + dishes.filter(d => d.jan && d.al).reduce((s, d) => s + Math.round(d.qty / 2), 0);
  const totalQty = dishes.reduce((s, d) => s + d.qty, 0);
  const diff = totalQty - total;

  let warn = '';
  if (Math.abs(diff) > 0) {
    const msg = diff > 0
      ? `${diff} prato${diff > 1 ? 's' : ''} a mais que slots disponíveis`
      : `${Math.abs(diff)} slot${Math.abs(diff) > 1 ? 's' : ''} sem prato atribuído`;
    warn = `<span class="warn-tag">⚠ ${msg}</span>`;
  }

  bar.innerHTML = `
    <span>Slots disponíveis: <strong>${total}</strong> (${al} almoços + ${jan} jantas)</span>
    <span>Total configurado: <strong>${totalQty}</strong></span>
    ${warn}`;
}

// ── Spread algorithm ───────────────────────────────────────────
function spread(reshuffle = false) {
  if (calPlan && !reshuffle) return;
  const start = getStartDate();
  if (!start) return;
  const days = getDays(start);

  // Build pools
  const alPool = [];
  const janPool = [];
  dishes.forEach(d => {
    if (d.al && d.jan) {
      // Split roughly half/half, bias toward al if odd
      const halfAl = Math.ceil(d.qty / 2);
      const halfJan = Math.floor(d.qty / 2);
      for (let i = 0; i < halfAl; i++) alPool.push(d.id);
      for (let i = 0; i < halfJan; i++) janPool.push(d.id);
    } else if (d.al) {
      for (let i = 0; i < d.qty; i++) alPool.push(d.id);
    } else if (d.jan) {
      for (let i = 0; i < d.qty; i++) janPool.push(d.id);
    }
  });

  // Shuffle pools and assign
  const sAl = shuffle(alPool);
  const sJan = shuffle(janPool);
  let ai = 0, ji = 0;

  // 'NOOPT' = "Sem opção": blocked by default, but still a valid drag-and-drop target.
  calPlan = days.map(d => {
    const dow = d.getDay();
    let al = null, jan = null;
    if (dow === 6)      { al = sAl[ai++] ?? null; jan = 'NOOPT'; }
    else if (dow === 0) { al = 'NOOPT';           jan = 'NOOPT'; }
    else                { al = sAl[ai++] ?? null; jan = sJan[ji++] ?? null; }
    return { date: d, al, jan };
  });

  renderCal();
}

// ── Legend ─────────────────────────────────────────────────────
function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = dishes.map(d => {
    const c = PALETTE[d.color];
    return `<span class="leg-item">
      <span class="leg-dot" style="background:${c.bg};border:1.5px solid ${c.text}"></span>
      <span>${escHtml(d.name)}</span>
    </span>`;
  }).join('');
}

// ── Calendar render ────────────────────────────────────────────
// Days flow as one continuous weekly grid — no visual break between
// months. A month change is marked only by a subtle inline label on
// that day's cell, never by restarting the grid.
function renderCal() {
  const start = getStartDate();
  const container = document.getElementById('calContainer');
  const errEl = document.getElementById('dateErr');

  if (!start) {
    errEl.textContent = document.getElementById('startDate').value ? 'Escolha uma segunda-feira.' : '';
    container.innerHTML = '';
    return;
  }
  errEl.textContent = '';

  const today = new Date(); today.setHours(0,0,0,0);
  const days = getDays(start);
  const dayNames = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const dowShortNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  let html = '<div class="cal-grid">';
  dayNames.forEach(n => { html += `<div class="cal-dh">${n}</div>`; });

  days.forEach((date, idx) => {
    const isToday = date.getTime() === today.getTime();
    const dow = date.getDay();
    const isMonthStart = idx === 0 || date.getDate() === 1;

    let monthTagHtml = '';
    if (isMonthStart) {
      const rawMn = date.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      monthTagHtml = `<div class="month-tag">${rawMn.charAt(0).toUpperCase() + rawMn.slice(1)}</div>`;
    }

    const alHtml = renderMealSlot(idx, 'al', date, 'almoço');
    const janHtml = renderMealSlot(idx, 'jan', date, 'janta');

    const dowShort = dowShortNames[dow];
    html += `<div class="cal-day${isToday ? ' today' : ''}${isMonthStart ? ' month-start' : ''}">
      ${monthTagHtml}
      <div class="day-num"><span class="dow-mobile">${dowShort}</span>${date.getDate()}</div>
      ${alHtml}${janHtml}
    </div>`;
  });

  const ld = dayOfWeekMon(days[days.length - 1].getDay());
  for (let e = 0; e < (ld < 6 ? 6 - ld : 0); e++) html += `<div class="cal-day empty"></div>`;
  html += '</div>';

  container.innerHTML = html;
  enableCalDragAndDrop();
  updateSummary();
  renderLegend();
}

function renderMealSlot(dayIdx, meal, date, label) {
  const entry = calPlan ? calPlan[dayIdx] : null;
  const val = entry ? entry[meal] : null;
  const isDelivery = date.getDay() === 5 && meal === 'jan';
  let inner;

  if (val === 'NOOPT') {
    inner = `<span class="meal-noopt">Sem opção</span>`;
  } else {
    const dish = val ? dishes.find(d => d.id === val) : null;
    if (dish) {
      const c = PALETTE[dish.color];
      inner = `<span class="meal-pill${isDelivery ? ' delivery' : ''}" draggable-slot
        data-day="${dayIdx}" data-meal="${meal}"
        style="background:${c.bg};color:${c.text}">${isDelivery ? '<span class="delivery-badge" title="Delivery">🛵</span>' : ''}${escHtml(dish.name)}</span>`;
    } else {
      inner = `<span class="${calPlan ? 'meal-none' : 'meal-empty'}">${calPlan ? '—' : '···'}</span>`;
    }
  }

  return `<div class="meal-slot" data-day="${dayIdx}" data-meal="${meal}">
    <div class="meal-lbl">${label}</div>
    ${inner}
  </div>`;
}

// ── Drag-and-drop (mouse + touch via Pointer Events) ─────────────
let dragState = null;

function enableCalDragAndDrop() {
  document.querySelectorAll('#calContainer .meal-pill[draggable-slot]').forEach(el => {
    el.addEventListener('pointerdown', onDragPointerDown);
  });
}

function onDragPointerDown(e) {
  if (!calPlan) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const pill = e.currentTarget;
  e.preventDefault();

  const rect = pill.getBoundingClientRect();
  const ghost = pill.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.removeAttribute('draggable-slot');
  ghost.style.position = 'fixed';
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.pointerEvents = 'none';
  ghost.style.zIndex = '1000';
  document.body.appendChild(ghost);

  pill.classList.add('dragging');

  dragState = {
    srcDay: +pill.dataset.day,
    srcMeal: pill.dataset.meal,
    pill, ghost,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    lastTarget: null,
  };

  pill.setPointerCapture(e.pointerId);
  pill.addEventListener('pointermove', onDragPointerMove);
  pill.addEventListener('pointerup', onDragPointerUp);
  pill.addEventListener('pointercancel', onDragPointerUp);
}

function onDragPointerMove(e) {
  if (!dragState) return;
  const { ghost, offsetX, offsetY } = dragState;
  ghost.style.left = (e.clientX - offsetX) + 'px';
  ghost.style.top = (e.clientY - offsetY) + 'px';

  ghost.style.display = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  ghost.style.display = '';
  const slot = under ? under.closest('.meal-slot') : null;

  if (dragState.lastTarget && dragState.lastTarget !== slot) {
    dragState.lastTarget.classList.remove('drop-target');
  }
  if (slot) slot.classList.add('drop-target');
  dragState.lastTarget = slot;
}

function onDragPointerUp(e) {
  if (!dragState) return;
  const { pill, ghost, srcDay, srcMeal, lastTarget } = dragState;
  pill.removeEventListener('pointermove', onDragPointerMove);
  pill.removeEventListener('pointerup', onDragPointerUp);
  pill.removeEventListener('pointercancel', onDragPointerUp);
  try { pill.releasePointerCapture(e.pointerId); } catch (_) {}
  ghost.remove();
  pill.classList.remove('dragging');
  if (lastTarget) lastTarget.classList.remove('drop-target');

  if (lastTarget) {
    const dstDay = +lastTarget.dataset.day;
    const dstMeal = lastTarget.dataset.meal;
    if (dstDay !== srcDay || dstMeal !== srcMeal) {
      swapSlots(srcDay, srcMeal, dstDay, dstMeal);
    }
  }
  dragState = null;
}

// Swaps two slots' contents. Dropping onto an empty or "Sem opção" slot
// simply moves the dish there (the source becomes empty rather than
// inheriting the "Sem opção" marker).
function swapSlots(srcDay, srcMeal, dstDay, dstMeal) {
  const srcEntry = calPlan[srcDay];
  const dstEntry = calPlan[dstDay];
  const srcVal = srcEntry[srcMeal];
  const dstVal = dstEntry[dstMeal];
  srcEntry[srcMeal] = (dstVal === 'NOOPT') ? null : dstVal;
  dstEntry[dstMeal] = srcVal;
  renderCal();
}

// ── Init ───────────────────────────────────────────────────────
(function init() {
  // Set start date to nearest past or current Monday
  const today = new Date();
  const dow = today.getDay();
  const diff = dow === 0 ? 6 : dow - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - diff);
  document.getElementById('startDate').value = monday.toISOString().slice(0, 10);
  document.getElementById('startDate').addEventListener('change', () => {
    calPlan = null;
    updateSummary();
    renderCal();
  });
  renderDishes();
})();

// ── PWA: service worker registration ────────────────────────────
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
